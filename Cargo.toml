[package]
name = "synap-forge-llm"
version = "0.1.3"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.98"

#openai API
chrono = "0.4.41"

#Web
axum = { version = "0.8.4", features = ["multipart"] }
tower-http = { version = "0.6.6", features = ["trace", "cors"] }

candle-core = { git = "https://github.com/huggingface/candle.git", version = "0.9.1" }
candle-nn = { git = "https://github.com/huggingface/candle.git", package = "candle-nn", version = "0.9.1" }
candle-transformers = { git = "https://github.com/huggingface/candle.git", package = "candle-transformers", version = "0.9.1" }
candle-flash-attn = { git = "https://github.com/huggingface/candle.git", version = "0.9.1", optional = true }

bindgen_cuda = { git = "https://github.com/guoqingbao/bindgen_cuda.git", version = "0.1.6", optional = true }
cudarc = { version = "0.16.3", features = ["std", "cublas", "cublaslt", "curand", "driver", "nvrtc", "f16", "cuda-version-from-build-system", "dynamic-linking"], default-features=false, optional = true }

nccl = { git = "https://github.com/zphixon/nccl", version = "5.4.0", optional = true }

hf-hub = "0.4.3"
safetensors = "0.6.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokenizers = "0.21.1"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.17.0", features = ["serde", "v4"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
rayon = "1.10.0"
rand = "0.8.5"
symphonia = { version = "0.5.3", features = ["all-codecs", "all-formats"] }
bytes = "1.6.0"
futures-util = "0.3.30"
tempfile = "3.20.0"
#core-graphics-types = {version = "0.1.3", optional = true}

[features]
default = ["candle-core/default", "candle-nn/default", "candle-transformers/default"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "candle-flash-attn", "dep:bindgen_cuda", "dep:cudarc", "dep:nccl"]
cudnn = ["candle-core/cudnn"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

#[build.env]
#passthrough = [
#    "RUST_BACKTRACE=full",
#    "RUST_LOG",
#    "TRAVIS",
#]